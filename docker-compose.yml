version: '3.9'

services:
  api:
    build: .
    container_name: qf_lms_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npx", "nodemon", "src/server.js"]
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: qf_lms_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-qf_lms}
      POSTGRES_USER: ${DB_USER:-qf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qf_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qf_user} -d ${DB_NAME:-qf_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qf_lms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
